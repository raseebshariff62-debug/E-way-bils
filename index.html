<script>

function printBill(){

    window.print();

}


async function downloadPDF(){

    const bill = document.querySelector(".paper");

    const button = document.querySelector(".download");

    button.innerHTML = "⏳ Creating PDF...";
    button.disabled = true;

    try{

        const canvas = await html2canvas(bill,{
            scale:2,
            useCORS:true,
            backgroundColor:"#ffffff"
        });

        const imgData = canvas.toDataURL("image/jpeg",1.0);

        const {jsPDF} = window.jspdf;

        const pdf = new jsPDF({
            orientation:"portrait",
            unit:"mm",
            format:"a4"
        });

        const pageWidth = 210;
        const pageHeight = 297;

        const margin = 5;

        const availableWidth = pageWidth - margin * 2;

        const imageHeight =
            canvas.height *
            availableWidth /
            canvas.width;

        let height = imageHeight;

        if(height > pageHeight - margin * 2){
            height = pageHeight - margin * 2;
        }

        pdf.addImage(
            imgData,
            "JPEG",
            margin,
            margin,
            availableWidth,
            height
        );

        pdf.save("E-Way-Bill-Demo.pdf");

    }catch(error){

        console.error(error);

        alert("PDF could not be created.");

    }

    button.innerHTML = "📥 Download PDF";
    button.disabled = false;

}

</script>
