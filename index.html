<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="eucx-AiW8uvd5dYfmKp-H6iyfPZx7BVzuqV8FMUgxaA" />
    <title>E-Way Bill</title>
</head>
<body>

    <!-- Your HTML Content Here -->

    <script>
    function printBill(){
        window.print();
    }

    async function downloadPDF(){
        const bill = document.querySelector(".paper");
        const button = document.querySelector(".download");

        button.innerHTML = "⏳ Creating PDF...";
        button.disabled = true;

        try {
            const canvas = await html2canvas(bill, {
                scale: 2,
                useCORS: true,
                backgroundColor: "#ffffff"
            });

            const imgData = canvas.toDataURL("image/png");
            const { jsPDF } = window.jspdf;

            const pdf = new jsPDF({
                orientation: "portrait",
                unit: "mm",
                format: "a4"
            });

            const pageWidth = 210;
            const pageHeight = 297;
            const margin = 5;

            const printableWidth = pageWidth - (margin * 2);
            const printableHeight = pageHeight - (margin * 2);

            const imgHeight = (canvas.height * printableWidth) / canvas.width;
            
            let heightLeft = imgHeight;
            let position = margin;

            pdf.addImage(
                imgData, 
                "PNG", 
                margin, 
                position, 
                printableWidth, 
                imgHeight
            );
            heightLeft -= printableHeight;

            while (heightLeft > 0) {
                position = heightLeft - imgHeight + margin;
                pdf.addPage();
                pdf.addImage(
                    imgData, 
                    "PNG", 
                    margin, 
                    position, 
                    printableWidth, 
                    imgHeight
                );
                heightLeft -= printableHeight;
            }

            pdf.save("E-Way-Bill-Demo.pdf");

        } catch (error) {
            console.error("PDF Generation Error:", error);
            alert("PDF could not be created.");
        } finally {
            button.innerHTML = "📥 Download PDF";
            button.disabled = false;
        }
    }
    </script>
</body>
</html>
